<line x1="150" y1="60" x2="150" y2="120" stroke="#1a6fb5" stroke-width="3" stroke-linecap="square"/>
<line x1="150" y1="120" x2="220" y2="120" stroke="#1a6fb5" stroke-width="3" stroke-linecap="square"/>
<line x1="220" y1="120" x2="220" y2="60" stroke="#1a6fb5" stroke-width="3" stroke-linecap="square"/>
<line x1="220" y1="60" x2="290" y2="60" stroke="#1a6fb5" stroke-width="3" stroke-linecap="square"/>
<line x1="290" y1="60" x2="290" y2="120" stroke="#1a6fb5" stroke-width="3" stroke-linecap="square"/>
<line x1="290" y1="120" x2="360" y2="120" stroke="#1a6fb5" stroke-width="3" stroke-linecap="square"/>
