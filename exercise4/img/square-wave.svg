<text x="232" y="191" font-size="13" fill="#333333">2272 &#181;s: one push and one pull</text>
<text x="70" y="65" text-anchor="end" font-size="14" fill="#333333">HIGH</text>
<text x="70" y="125" text-anchor="end" font-size="14" fill="#333333">LOW</text>
<text x="70" y="30" text-anchor="end" font-size="13" fill="#888888">GP20</text>
<text x="580" y="65" font-size="12" fill="#888888">push</text>
<text x="580" y="125" font-size="12" fill="#888888">pull</text>
<text x="80" y="222" font-size="13" fill="#666666">440 pushes per second = 440 Hz = the note A4</text>
